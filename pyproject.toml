[project]
name = "rentals-api"
version = "1.0.0"
description = "StayEase Rentals API: a FastAPI service with built-in telemetry, plus load and chaos simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[tool.uv]
package = false    # an application, not an installable library
