[project]
name = "rentals-api"
version = "1.0.0"
description = "StayEase Rentals API: a FastAPI service with built-in telemetry, plus load and chaos simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mcp[cli]>=2.3.0",
]

[tool.uv]
package = false    # an application, not an installable library

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
